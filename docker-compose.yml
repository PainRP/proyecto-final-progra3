services:
  mongodb:
    image: mongo:7
    container_name: proyecto-final-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    container_name: proyecto-final-postgres
    environment:
      POSTGRES_DB: progra3db
      POSTGRES_USER: progra3
      POSTGRES_PASSWORD: progra3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data:
