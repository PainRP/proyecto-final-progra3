spring.application.name=app
server.port=8081

# Configuracion del motor y persistencia
# Estrategias disponibles:
# app.tree-strategy=custom
# app.tree-strategy=collections
app.tree-strategy=custom

# Almacenamientos disponibles:
# app.storage=mongo
app.storage=mongo

# Configuracion MongoDB
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=proyecto_final_arboles
spring.profiles.default=memory
